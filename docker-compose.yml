services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: ehdathi
      POSTGRES_USER: ehdathi
      POSTGRES_PASSWORD: ehdathi_dev
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ehdathi -d ehdathi"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgres://ehdathi:ehdathi_dev@db:5432/ehdathi
      PORT: 3000
      GROQ_API_KEY: ${GROQ_API_KEY}
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    environment:
      VITE_API_URL: http://localhost:3000
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  db_data:
