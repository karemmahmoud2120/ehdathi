# fly.toml app configuration file generated for ehdathi-backend
app = "backend-windblown-pathway-6199"
primary_region = "cdg" # أو أي منطقة إنت مختارها

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1